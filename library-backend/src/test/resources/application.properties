spring.datasource.url=jdbc:h2:mem:librarytest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# The Flyway baseline is PostgreSQL-specific. H2 tests create their own schema.
spring.flyway.enabled=false
jwt.secret=mysecretkeymysecretkeymysecretkey123
app.cors.allowed-origin=https://library-ui.test
