spring.application.name=LibraryManagement
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

jwt.secret=${JWT_SECRET}
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN}

# Verify an existing schema at startup; schema changes should be applied deliberately.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway applies versioned SQL migrations before Hibernate validates the schema.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing Library schema baseline
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
# Borrowing configuration
app.borrowing.loan-period-days=14
app.borrowing.max-active-loans=3
app.borrowing.timezone=Asia/Kolkata

# Never allow Flyway to wipe an existing database.
spring.flyway.clean-disabled=true
